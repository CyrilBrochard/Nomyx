openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Marketing Naming Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: team
    description: Team management
  - name: dimensions
    description: Naming dimensions
  - name: dimension-values
    description: Values for each dimension
  - name: outputs
    description: Output format definitions
  - name: generate
    description: Name generation engine
  - name: config
    description: Config export/import

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user and team
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBody"
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login and receive a JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get the current user's info
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInfo"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /team/members:
    get:
      operationId: listTeamMembers
      tags: [team]
      summary: List all members of the current team
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of team members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamMember"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /team/invite:
    post:
      operationId: createInvite
      tags: [team]
      summary: Generate an invite link for the current team (owner only)
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Invite created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden – only owners can create invites
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/invite/accept:
    post:
      operationId: acceptInvite
      tags: [auth]
      summary: Register a new user under an existing team using an invite token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInviteBody"
      responses:
        "201":
          description: User registered under invited team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Bad request or invalid/expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dimensions:
    get:
      operationId: listDimensions
      tags: [dimensions]
      summary: List all dimensions for the current team
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of dimensions with their values
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DimensionWithValues"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      operationId: createDimension
      tags: [dimensions]
      summary: Create a new dimension
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDimensionBody"
      responses:
        "201":
          description: Dimension created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dimension"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dimensions/{id}:
    put:
      operationId: updateDimension
      tags: [dimensions]
      summary: Update a dimension
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDimensionBody"
      responses:
        "200":
          description: Dimension updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dimension"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Dimension not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteDimension
      tags: [dimensions]
      summary: Delete a dimension
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Dimension deleted
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Dimension not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dimensions/{id}/duplicate:
    post:
      operationId: duplicateDimension
      tags: [dimensions]
      summary: Duplicate a dimension and its values
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Duplicated dimension with values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DimensionWithValues"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Dimension not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dimensions/{id}/values:
    get:
      operationId: listDimensionValues
      tags: [dimension-values]
      summary: List values for a dimension
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of values
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DimensionValue"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      operationId: createDimensionValue
      tags: [dimension-values]
      summary: Add a value to a dimension
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDimensionValueBody"
      responses:
        "201":
          description: Value created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DimensionValue"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dimensions/{id}/values/{valueId}:
    put:
      operationId: updateDimensionValue
      tags: [dimension-values]
      summary: Update a dimension value
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: valueId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDimensionValueBody"
      responses:
        "200":
          description: Value updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DimensionValue"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteDimensionValue
      tags: [dimension-values]
      summary: Delete a dimension value
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: valueId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Value deleted
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /outputs:
    get:
      operationId: listOutputs
      tags: [outputs]
      summary: List all output formats for the current team
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of output formats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Output"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      operationId: createOutput
      tags: [outputs]
      summary: Create a new output format
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOutputBody"
      responses:
        "201":
          description: Output created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Output"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /outputs/{id}:
    put:
      operationId: updateOutput
      tags: [outputs]
      summary: Update an output format
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOutputBody"
      responses:
        "200":
          description: Output updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Output"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteOutput
      tags: [outputs]
      summary: Delete an output format
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Output deleted
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /generate:
    post:
      operationId: generateNames
      tags: [generate]
      summary: Generate naming outputs based on selected dimension values
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateBody"
      responses:
        "200":
          description: Generated naming outputs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /config/export:
    get:
      operationId: exportConfig
      tags: [config]
      summary: Export the full team configuration as JSON
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Team config JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamConfig"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /config/import:
    post:
      operationId: importConfig
      tags: [config]
      summary: Import a team configuration from JSON (merges dimensions and outputs)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamConfig"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [generate]
      summary: Get team dashboard stats (dimension count, output count, etc.)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    RegisterBody:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        teamName:
          type: string
      required:
        - email
        - password
        - teamName

    LoginBody:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
        - email
        - password

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/UserInfo"
      required:
        - token
        - user

    UserInfo:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        teamId:
          type: integer
        teamName:
          type: string
        role:
          type: string
      required:
        - id
        - email
        - teamId
        - teamName
        - role

    TeamMember:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        role:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - email
        - role
        - createdAt

    InviteResponse:
      type: object
      properties:
        inviteUrl:
          type: string
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
      required:
        - inviteUrl
        - token
        - expiresAt

    AcceptInviteBody:
      type: object
      properties:
        token:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
      required:
        - token
        - email
        - password

    Dimension:
      type: object
      properties:
        id:
          type: integer
        teamId:
          type: integer
        name:
          type: string
        code:
          type: string
        order:
          type: integer
        enabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - teamId
        - name
        - code
        - order
        - enabled
        - createdAt
        - updatedAt

    DimensionWithValues:
      allOf:
        - $ref: "#/components/schemas/Dimension"
        - type: object
          properties:
            values:
              type: array
              items:
                $ref: "#/components/schemas/DimensionValue"
          required:
            - values

    DimensionValue:
      type: object
      properties:
        id:
          type: integer
        dimensionId:
          type: integer
        label:
          type: string
        shortCode:
          type: string
        order:
          type: integer
        enabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - dimensionId
        - label
        - shortCode
        - order
        - enabled
        - createdAt
        - updatedAt

    CreateDimensionBody:
      type: object
      properties:
        name:
          type: string
        code:
          type: string
        order:
          type: integer
        enabled:
          type: boolean
      required:
        - name
        - code

    UpdateDimensionBody:
      type: object
      properties:
        name:
          type: string
        code:
          type: string
        order:
          type: integer
        enabled:
          type: boolean

    CreateDimensionValueBody:
      type: object
      properties:
        label:
          type: string
        shortCode:
          type: string
        order:
          type: integer
        enabled:
          type: boolean
      required:
        - label
        - shortCode

    UpdateDimensionValueBody:
      type: object
      properties:
        label:
          type: string
        shortCode:
          type: string
        order:
          type: integer
        enabled:
          type: boolean

    Output:
      type: object
      properties:
        id:
          type: integer
        teamId:
          type: integer
        name:
          type: string
        code:
          type: string
        format:
          type: string
          description: "Token-based format string, e.g. [Brand]_[Market]_[Objective]"
        separator:
          type: string
          description: "Separator between tokens: underscore, dash, or space"
        enabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - teamId
        - name
        - code
        - format
        - separator
        - enabled
        - createdAt
        - updatedAt

    CreateOutputBody:
      type: object
      properties:
        name:
          type: string
        code:
          type: string
        format:
          type: string
        separator:
          type: string
        enabled:
          type: boolean
      required:
        - name
        - code
        - format
        - separator

    UpdateOutputBody:
      type: object
      properties:
        name:
          type: string
        code:
          type: string
        format:
          type: string
        separator:
          type: string
        enabled:
          type: boolean

    GenerateBody:
      type: object
      properties:
        selections:
          type: object
          description: "Map of dimensionId (as string) to valueId (as number)"
          additionalProperties:
            type: integer
      required:
        - selections

    GeneratedOutput:
      type: object
      properties:
        outputId:
          type: integer
        outputName:
          type: string
        outputCode:
          type: string
        result:
          type: string
      required:
        - outputId
        - outputName
        - outputCode
        - result

    GenerateResponse:
      type: object
      properties:
        outputs:
          type: array
          items:
            $ref: "#/components/schemas/GeneratedOutput"
      required:
        - outputs

    TeamConfig:
      type: object
      properties:
        teamName:
          type: string
        dimensions:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              code:
                type: string
              order:
                type: integer
              enabled:
                type: boolean
              values:
                type: array
                items:
                  type: object
                  properties:
                    label:
                      type: string
                    shortCode:
                      type: string
                    order:
                      type: integer
                    enabled:
                      type: boolean
                  required:
                    - label
                    - shortCode
            required:
              - name
              - code
              - values
        outputs:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              code:
                type: string
              format:
                type: string
              separator:
                type: string
              enabled:
                type: boolean
            required:
              - name
              - code
              - format
              - separator
      required:
        - teamName
        - dimensions
        - outputs

    ImportResult:
      type: object
      properties:
        importedDimensions:
          type: integer
        importedOutputs:
          type: integer
      required:
        - importedDimensions
        - importedOutputs

    DashboardStats:
      type: object
      properties:
        totalDimensions:
          type: integer
        enabledDimensions:
          type: integer
        totalOutputs:
          type: integer
        enabledOutputs:
          type: integer
        totalValues:
          type: integer
        teamName:
          type: string
      required:
        - totalDimensions
        - enabledDimensions
        - totalOutputs
        - enabledOutputs
        - totalValues
        - teamName
