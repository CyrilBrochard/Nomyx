kind = "web"
previewPath = "/"
title = "Marketing Naming Platform"
version = "1.0.0"
id = "artifacts/marketing-naming-platform"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21119

[services.development]
run = "pnpm --filter @workspace/marketing-naming-platform run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/marketing-naming-platform", "run", "build" ]
publicDir = "artifacts/marketing-naming-platform/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21119"
BASE_PATH = "/"
